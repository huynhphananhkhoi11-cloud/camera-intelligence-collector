name: phase11i1-vj-price-diagnostic

permissions:
  contents: read

on:
  push:
    branches:
      - agent/phase11i1-autofix

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Inspect VJShop primary price topology
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import * as cheerio from "cheerio";
          import { collectBrowserDetail } from "./dist/v02/extraction/browserDetailCollector.js";
          import { extractRawProductFactsFromHtml } from "./dist/v02/rawProductExtractor.js";
          import { processProductHtml } from "./dist/v02/pipeline/productPipeline.js";

          const url =
            "https://vjshop.vn/may-anh-mirrorless/sony-alpha-a6400-black-base-lens-sigma-18-50mm-f28";

          const browser =
            await chromium.launch({
              headless: true
            });

          const context =
            await browser.newContext({
              viewport: {
                width: 1440,
                height: 1000
              }
            });

          const page =
            await context.newPage();

          try {
            const acquisition =
              await collectBrowserDetail(
                page,
                url
              );

            const facts =
              extractRawProductFactsFromHtml(
                acquisition.html,
                acquisition.canonicalUrl || url
              );

            const result =
              processProductHtml(
                acquisition.html,
                acquisition.canonicalUrl || url,
                "SALE_NEW"
              );

            const $ =
              cheerio.load(
                acquisition.html
              );

            const selectors = [
              '[itemprop="price"]',
              '[data-price]',
              '.price',
              '.product-price',
              '.sale-price',
              '.current-price',
              '[class*="price"]'
            ].join(",");

            const clean =
              value =>
                String(value ?? "")
                  .replace(/\s+/g, " ")
                  .trim();

            const priceNodes =
              $(selectors)
                .toArray()
                .map(
                  (element, index) => {
                    const node =
                      $(element);

                    const ancestors = [];
                    let cursor =
                      node;

                    for (
                      let depth = 0;
                      depth < 5;
                      depth++
                    ) {
                      cursor =
                        cursor.parent();

                      if (
                        cursor.length === 0
                      ) {
                        break;
                      }

                      ancestors.push({
                        depth:
                          depth + 1,
                        tag:
                          cursor.get(0)?.tagName ?? "",
                        className:
                          clean(
                            cursor.attr("class")
                          ),
                        text:
                          clean(
                            cursor.text()
                          ).slice(
                            0,
                            700
                          )
                      });
                    }

                    return {
                      index,
                      tag:
                        element.tagName,
                      className:
                        clean(
                          node.attr("class")
                        ),
                      itemprop:
                        clean(
                          node.attr("itemprop")
                        ),
                      dataPrice:
                        clean(
                          node.attr("data-price")
                        ),
                      text:
                        clean(
                          node.text()
                        ).slice(
                          0,
                          500
                        ),
                      ancestors
                    };
                  }
                )
                .filter(
                  item =>
                    /(?:đ|₫|vnd|\d{5,})/i
                      .test(
                        item.text +
                        " " +
                        item.dataPrice
                      )
                )
                .slice(
                  0,
                  80
                );

            console.log(
              "VJ_PRICE_TOPOLOGY=" +
              JSON.stringify(
                {
                  factsVisible:
                    facts.visiblePriceTexts,
                  resolvedSalePrice:
                    result.fields.salePrice,
                  row:
                    result.row,
                  priceNodes
                },
                null,
                2
              )
            );
          }
          finally {
            await context.close();
            await browser.close();
          }
          NODE
