name: phase11i1-wide-diagnostics

permissions:
  contents: read

on:
  push:
    branches:
      - agent/phase11i1-autofix

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Diagnose four failed direct-product cases
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { collectBrowserDetail } from "./dist/v02/extraction/browserDetailCollector.js";
          import { discoverProductUrlsFromHtml } from "./dist/v02/discovery/productUrlDiscovery.js";
          import { processProductHtml } from "./dist/v02/pipeline/productPipeline.js";

          const cases = [
            {
              id: "tiemchupanh-a6400",
              url: "https://tiemchupanh.com/san-pham/cho-thue-may-anh-sony-alpha-a6400/",
              siteMode: "RENTAL"
            },
            {
              id: "dathanhcamera-a6400",
              url: "https://dathanhcamera.com/thue-camera-may-anh/cho-thue-may-anh-sony-alpha-a6400-may-2",
              siteMode: "RENTAL"
            },
            {
              id: "zshop-a6400",
              url: "https://zshop.vn/sony-alpha-a6400.html",
              siteMode: "SALE_NEW"
            },
            {
              id: "vjshop-a6400",
              url: "https://vjshop.vn/may-anh-mirrorless/sony-alpha-a6400-black-base-lens-sigma-18-50mm-f28",
              siteMode: "SALE_NEW"
            }
          ];

          const browser =
            await chromium.launch({
              headless: true
            });

          try {
            for (const item of cases) {
              const context =
                await browser.newContext({
                  viewport: {
                    width: 1440,
                    height: 1000
                  }
                });

              const page =
                await context.newPage();

              try {
                const acquisition =
                  await collectBrowserDetail(
                    page,
                    item.url
                  );

                const effectiveUrl =
                  acquisition.canonicalUrl ||
                  item.url;

                const discovery =
                  discoverProductUrlsFromHtml(
                    acquisition.html,
                    effectiveUrl
                  );

                const result =
                  processProductHtml(
                    acquisition.html,
                    effectiveUrl,
                    item.siteMode
                  );

                const jsonLdTypes = [];

                const walk = value => {
                  if (
                    value === null ||
                    value === undefined
                  ) {
                    return;
                  }

                  if (
                    Array.isArray(value)
                  ) {
                    for (const child of value) {
                      walk(child);
                    }

                    return;
                  }

                  if (
                    typeof value !==
                      "object"
                  ) {
                    return;
                  }

                  const type =
                    value["@type"];

                  if (type) {
                    jsonLdTypes.push(
                      Array.isArray(type)
                        ? type.join("|")
                        : String(type)
                    );
                  }

                  for (const child of Object.values(value)) {
                    walk(child);
                  }
                };

                walk(
                  result.facts.jsonLd
                );

                console.log(
                  "WIDE_DIAGNOSTIC_" +
                  item.id +
                  "=" +
                  JSON.stringify(
                    {
                      requestedUrl:
                        acquisition.requestedUrl,
                      finalUrl:
                        acquisition.finalUrl,
                      canonicalUrl:
                        acquisition.canonicalUrl,
                      acquisitionErrors:
                        acquisition.errors,
                      discovery: {
                        productUrls:
                          discovery.productUrls,
                        currentCandidates:
                          discovery.candidates.filter(
                            candidate =>
                              candidate.url ===
                                effectiveUrl
                          )
                      },
                      title:
                        result.facts.title,
                      listingCategory:
                        result.facts.listingCategory,
                      breadcrumbs:
                        result.facts.breadcrumbs,
                      visiblePriceTexts:
                        result.facts.visiblePriceTexts,
                      buttons:
                        result.facts.buttons,
                      sections:
                        result.facts.sections,
                      jsonLdTypes:
                        Array.from(
                          new Set(
                            jsonLdTypes
                          )
                        ),
                      entity:
                        result.analysis.entity,
                      offer:
                        result.analysis.offer,
                      condition:
                        result.analysis.condition,
                      fields:
                        result.fields,
                      validation:
                        result.validation,
                      row:
                        result.row
                    },
                    null,
                    2
                  )
                );
              }
              finally {
                await context.close();
              }
            }
          }
          finally {
            await browser.close();
          }
          NODE
