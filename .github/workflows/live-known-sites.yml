name: Known-site live gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live-${{ matrix.slug }}
    runs-on: windows-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slug: mayanhtop1
            url: https://mayanhtop1.com/
          - slug: zshop
            url: https://zshop.vn/
          - slug: binhminh
            url: https://binhminhdigital.com/
          - slug: anhduc
            url: https://anhducdigital.vn/

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build
        run: npm run build

      - name: Bounded collect and audit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $xlsx = Join-Path $PWD "artifacts\${{ matrix.slug }}.xlsx"
          $log = Join-Path $PWD "artifacts\${{ matrix.slug }}.log"

          & node dist/v03/cli/camintel.js collect "${{ matrix.url }}" --max-products 120 --concurrency 3 --no-open --output $xlsx 2>&1 |
            Tee-Object -FilePath $log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          & node scripts/live-audit.mjs $xlsx "${{ matrix.slug }}" 2>&1 |
            Tee-Object -FilePath $log -Append

          exit $LASTEXITCODE

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-${{ matrix.slug }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
