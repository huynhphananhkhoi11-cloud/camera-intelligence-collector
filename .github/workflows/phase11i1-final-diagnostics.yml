name: phase11i1-final-diagnostics

permissions:
  contents: read

on:
  push:
    branches:
      - agent/phase11i1-autofix

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Diagnose remaining live failures
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { collectBrowserDetail } from "./dist/v02/extraction/browserDetailCollector.js";
          import { discoverProductUrlsFromHtml } from "./dist/v02/discovery/productUrlDiscovery.js";
          import { processProductHtml } from "./dist/v02/pipeline/productPipeline.js";

          const browser = await chromium.launch({ headless: true });

          try {
            {
              const url =
                "https://dathanhcamera.com/thue-camera-may-anh/cho-thue-may-anh-sony-alpha-a6400-may-2";

              const context = await browser.newContext({
                viewport: { width: 1440, height: 1000 }
              });

              const page = await context.newPage();

              try {
                const acquisition =
                  await collectBrowserDetail(page, url);

                const effectiveUrl =
                  acquisition.canonicalUrl ||
                  url;

                const discovery =
                  discoverProductUrlsFromHtml(
                    acquisition.html,
                    effectiveUrl
                  );

                const result =
                  processProductHtml(
                    acquisition.html,
                    effectiveUrl,
                    "RENTAL"
                  );

                const actionNodes =
                  await page.locator(
                    "button,a,input,[role=button]"
                  ).evaluateAll(nodes =>
                    nodes
                      .map(node => ({
                        tag:
                          node.tagName,
                        text:
                          String(
                            node.textContent ||
                            node.value ||
                            ""
                          )
                            .replace(/\s+/g, " ")
                            .trim(),
                        className:
                          String(
                            node.getAttribute(
                              "class"
                            ) || ""
                          ),
                        href:
                          String(
                            node.getAttribute(
                              "href"
                            ) || ""
                          )
                      }))
                      .filter(item =>
                        /thuê|thue|rent/i.test(
                          item.text
                        )
                      )
                      .slice(0, 30)
                  );

                console.log(
                  "DATHANH_RECHECK=" +
                  JSON.stringify(
                    {
                      requestedUrl:
                        acquisition.requestedUrl,
                      finalUrl:
                        acquisition.finalUrl,
                      canonicalUrl:
                        acquisition.canonicalUrl,
                      errors:
                        acquisition.errors,
                      discovery:
                        discovery.candidates
                          .filter(
                            candidate =>
                              candidate.url ===
                                effectiveUrl
                          ),
                      productUrls:
                        discovery.productUrls
                          .slice(0, 20),
                      title:
                        result.facts.title,
                      visiblePriceTexts:
                        result.facts.visiblePriceTexts,
                      buttons:
                        result.facts.buttons,
                      actionNodes,
                      entity:
                        result.analysis.entity,
                      offer:
                        result.analysis.offer,
                      rentalPrice:
                        result.fields.rentalPrice,
                      validation:
                        result.validation
                    },
                    null,
                    2
                  )
                );
              }
              finally {
                await context.close();
              }
            }

            {
              const url =
                "https://vjshop.vn/may-anh-mirrorless/sony-alpha-a6400-black-base-lens-sigma-18-50mm-f28";

              const context = await browser.newContext({
                viewport: { width: 1440, height: 1000 }
              });

              const page = await context.newPage();

              try {
                const acquisition =
                  await collectBrowserDetail(page, url);

                const effectiveUrl =
                  acquisition.canonicalUrl ||
                  url;

                const result =
                  processProductHtml(
                    acquisition.html,
                    effectiveUrl,
                    "SALE_NEW"
                  );

                const domPrices =
                  await page.locator("body *")
                    .evaluateAll(nodes =>
                      nodes
                        .map(node => {
                          const text =
                            String(
                              node.textContent ||
                              ""
                            )
                              .replace(/\s+/g, " ")
                              .trim();

                          const directText =
                            Array.from(
                              node.childNodes
                            )
                              .filter(
                                child =>
                                  child.nodeType ===
                                    3
                              )
                              .map(
                                child =>
                                  child.textContent ||
                                  ""
                              )
                              .join(" ")
                              .replace(/\s+/g, " ")
                              .trim();

                          return {
                            tag:
                              node.tagName,
                            id:
                              String(
                                node.getAttribute(
                                  "id"
                                ) || ""
                              ),
                            className:
                              String(
                                node.getAttribute(
                                  "class"
                                ) || ""
                              ),
                            directText,
                            text:
                              text.slice(
                                0,
                                300
                              ),
                            dataPrice:
                              String(
                                node.getAttribute(
                                  "data-price"
                                ) ||
                                node.getAttribute(
                                  "data-price-amount"
                                ) ||
                                node.getAttribute(
                                  "data-price-value"
                                ) ||
                                ""
                              ),
                            itemprop:
                              String(
                                node.getAttribute(
                                  "itemprop"
                                ) || ""
                              ),
                            content:
                              String(
                                node.getAttribute(
                                  "content"
                                ) || ""
                              )
                          };
                        })
                        .filter(item =>
                          (
                            /\d[\d.,\s]{2,}\s*(?:đ|₫|vnd)/i
                              .test(
                                item.directText
                              ) ||
                            /price/i.test(
                              item.className +
                              " " +
                              item.id +
                              " " +
                              item.itemprop
                            ) ||
                            Boolean(
                              item.dataPrice
                            )
                          ) &&
                          item.text.length <
                            1200
                        )
                        .slice(0, 120)
                    );

                const priceMeta =
                  await page.locator("meta")
                    .evaluateAll(nodes =>
                      nodes
                        .map(node => ({
                          property:
                            String(
                              node.getAttribute(
                                "property"
                              ) || ""
                            ),
                          name:
                            String(
                              node.getAttribute(
                                "name"
                              ) || ""
                            ),
                          itemprop:
                            String(
                              node.getAttribute(
                                "itemprop"
                              ) || ""
                            ),
                          content:
                            String(
                              node.getAttribute(
                                "content"
                              ) || ""
                            )
                        }))
                        .filter(item =>
                          /price|amount|currency/i
                            .test(
                              item.property +
                              " " +
                              item.name +
                              " " +
                              item.itemprop
                            )
                        )
                        .slice(0, 80)
                    );

                const scripts =
                  await page.locator("script")
                    .evaluateAll(nodes =>
                      nodes
                        .map(node =>
                          String(
                            node.textContent ||
                            ""
                          )
                        )
                        .filter(text =>
                          /27480000|27[.,]480[.,]000|price/i
                            .test(text)
                        )
                        .map(text => {
                          const normalized =
                            text.replace(
                              /\s+/g,
                              " "
                            );

                          const priceIndex =
                            normalized.search(
                              /27480000|27[.,]480[.,]000|price/i
                            );

                          return normalized.slice(
                            Math.max(
                              0,
                              priceIndex -
                                500
                            ),
                            priceIndex +
                              1500
                          );
                        })
                        .slice(0, 20)
                    );

                const h1Ancestors =
                  await page.locator("h1")
                    .first()
                    .evaluate(node => {
                      const output = [];
                      let cursor = node;

                      for (
                        let depth = 0;
                        depth < 6 &&
                        cursor;
                        depth++
                      ) {
                        output.push({
                          depth,
                          tag:
                            cursor.tagName,
                          id:
                            cursor.getAttribute(
                              "id"
                            ) || "",
                          className:
                            cursor.getAttribute(
                              "class"
                            ) || "",
                          text:
                            String(
                              cursor.textContent ||
                              ""
                            )
                              .replace(/\s+/g, " ")
                              .trim()
                              .slice(
                                0,
                                1800
                              )
                        });

                        cursor =
                          cursor.parentElement;
                      }

                      return output;
                    });

                console.log(
                  "VJSHOP_PRICE_DIAGNOSTIC=" +
                  JSON.stringify(
                    {
                      finalUrl:
                        acquisition.finalUrl,
                      errors:
                        acquisition.errors,
                      networkApiCandidates:
                        acquisition
                          .networkSnapshot
                          .apiCandidates
                          .slice(0, 30),
                      title:
                        result.facts.title,
                      visiblePriceTexts:
                        result.facts.visiblePriceTexts,
                      buttons:
                        result.facts.buttons,
                      jsonLd:
                        result.facts.jsonLd,
                      salePrice:
                        result.fields.salePrice,
                      validation:
                        result.validation,
                      domPrices,
                      priceMeta,
                      scripts,
                      h1Ancestors
                    },
                    null,
                    2
                  )
                );
              }
              finally {
                await context.close();
              }
            }
          }
          finally {
            await browser.close();
          }
          NODE
