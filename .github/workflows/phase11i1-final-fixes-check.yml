name: phase11i1-final-fixes-check

permissions:
  contents: read

on:
  push:
    branches:
      - agent/phase11i1-autofix

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Targeted final-gap tests
        run: |
          npx vitest run \
            tests/v02/rawProductPrimaryScope.test.ts \
            tests/v02/extraction/browserDetailCollector.test.ts \
            tests/v02/cli/collectV2ProductSelectionIntegration.test.ts

      - run: npm test
      - run: npm run check
      - run: npm run build
