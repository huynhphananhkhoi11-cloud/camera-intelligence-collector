name: phase11i1-thuelens-diagnostic

permissions:
  contents: read

on:
  push:
    branches:
      - agent/phase11i1-autofix

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Inspect Thuê Lens tripod classification
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { collectBrowserDetail } from "./dist/v02/extraction/browserDetailCollector.js";
          import { processProductHtml } from "./dist/v02/pipeline/productPipeline.js";

          const url =
            "https://thuelens.com/lens/cho-thue-chan-may-quay-benro-kh-25";

          const browser =
            await chromium.launch({
              headless: true
            });

          const context =
            await browser.newContext({
              viewport: {
                width: 1440,
                height: 1000
              }
            });

          const page =
            await context.newPage();

          try {
            const acquisition =
              await collectBrowserDetail(
                page,
                url
              );

            const result =
              processProductHtml(
                acquisition.html,
                acquisition.canonicalUrl || url,
                "RENTAL"
              );

            const bodyText =
              await page.locator("body")
                .innerText()
                .catch(
                  () => ""
                );

            console.log(
              "THUELENS_DIAGNOSTIC=" +
              JSON.stringify(
                {
                  requestedUrl:
                    acquisition.requestedUrl,
                  finalUrl:
                    acquisition.finalUrl,
                  canonicalUrl:
                    acquisition.canonicalUrl,
                  acquisitionErrors:
                    acquisition.errors,
                  title:
                    result.facts.title,
                  listingCategory:
                    result.facts.listingCategory,
                  breadcrumbs:
                    result.facts.breadcrumbs,
                  visiblePriceTexts:
                    result.facts.visiblePriceTexts,
                  buttons:
                    result.facts.buttons,
                  sections:
                    result.facts.sections,
                  entity:
                    result.analysis.entity,
                  offer:
                    result.analysis.offer,
                  fields:
                    result.fields,
                  validation:
                    result.validation,
                  row:
                    result.row,
                  bodyText:
                    bodyText.slice(
                      0,
                      5000
                    )
                },
                null,
                2
              )
            );
          }
          finally {
            await context.close();
            await browser.close();
          }
          NODE
