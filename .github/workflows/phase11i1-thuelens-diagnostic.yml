name: phase11i1-thuelens-diagnostic

permissions:
  contents: read

on:
  push:
    branches:
      - agent/phase11i1-autofix

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Inspect Thuê Lens tripod classification
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import * as cheerio from "cheerio";
          import { collectBrowserDetail } from "./dist/v02/extraction/browserDetailCollector.js";
          import { processProductHtml } from "./dist/v02/pipeline/productPipeline.js";

          const url =
            "https://thuelens.com/lens/cho-thue-chan-may-quay-benro-kh-25";

          const browser =
            await chromium.launch({
              headless: true
            });

          const context =
            await browser.newContext({
              viewport: {
                width: 1440,
                height: 1000
              }
            });

          const page =
            await context.newPage();

          try {
            const acquisition =
              await collectBrowserDetail(
                page,
                url
              );

            const result =
              processProductHtml(
                acquisition.html,
                acquisition.canonicalUrl || url,
                "RENTAL"
              );

            const captured$ =
              cheerio.load(
                acquisition.html
              );

            const productHeadingOwners =
              [
                '[itemtype*="Product"]',
                "[data-product-id]",
                ".product-detail",
                ".product-details",
                '[class*="product-detail"]',
                '[class*="product_details"]',
                "article.product",
                ".product"
              ].join(",");

            const capturedHeadingTopology =
              captured$(
                "h1,h2,h3,h4"
              )
                .toArray()
                .map(
                  (element, index) => {
                    const node =
                      captured$(
                        element
                      );

                    const signature =
                      [
                        node.attr(
                          "class"
                        ),
                        node.attr(
                          "id"
                        )
                      ]
                        .filter(Boolean)
                        .join(
                          " "
                        );

                    const ancestors = [];
                    let cursor =
                      node;

                    for (
                      let depth = 0;
                      depth < 6;
                      depth++
                    ) {
                      cursor =
                        cursor.parent();

                      if (
                        cursor.length ===
                          0
                      ) {
                        break;
                      }

                      ancestors.push({
                        tag:
                          cursor.get(0)?.tagName ??
                          "",
                        className:
                          String(
                            cursor.attr(
                              "class"
                            ) ??
                            ""
                          )
                      });
                    }

                    return {
                      index,
                      tag:
                        element.tagName,
                      text:
                        String(
                          node.text() ??
                          ""
                        )
                          .replace(
                            /\s+/g,
                            " "
                          )
                          .trim(),
                      className:
                        String(
                          node.attr(
                            "class"
                          ) ??
                          ""
                        ),
                      id:
                        String(
                          node.attr(
                            "id"
                          ) ??
                          ""
                        ),
                      signature,
                      isChromeByAncestor:
                        node.closest(
                          "header,nav,footer,[role=\"navigation\"]"
                        ).length >
                        0,
                      isChromeBySignature:
                        (
                          /logo/.test(
                            signature.toLowerCase()
                          ) ||
                          /site[-_ ]?(?:title|brand)/.test(
                            signature.toLowerCase()
                          ) ||
                          /(?:^|[\s_-])brand(?:$|[\s_-])/.test(
                            signature.toLowerCase()
                          )
                        ),
                      isProductOwner:
                        node.is(
                          productHeadingOwners
                        ),
                      closestProductOwner:
                        node.closest(
                          productHeadingOwners
                        ).attr(
                          "class"
                        ) ??
                        "",
                      ancestors
                    };
                  }
                );

            const headingTopology =
              await page.evaluate(
                () =>
                  Array.from(
                    document.querySelectorAll(
                      "h1,h2,h3,h4"
                    )
                  ).map(
                    (element, index) => ({
                      index,
                      tag:
                        element.tagName,
                      text:
                        String(
                          element.textContent ??
                          ""
                        )
                          .replace(
                            /\s+/g,
                            " "
                          )
                          .trim(),
                      className:
                        String(
                          element.getAttribute(
                            "class"
                          ) ??
                          ""
                        ),
                      id:
                        String(
                          element.id ??
                          ""
                        )
                    })
                  )
              );

            const metaTopology =
              await page.evaluate(
                () => ({
                  ogTitle:
                    document
                      .querySelector(
                        'meta[property="og:title"]'
                      )
                      ?.getAttribute(
                        "content"
                      ) ??
                    "",
                  documentTitle:
                    document.title,
                  canonical:
                    document
                      .querySelector(
                        'link[rel="canonical"]'
                      )
                      ?.getAttribute(
                        "href"
                      ) ??
                    ""
                })
              );

            const bodyText =
              await page.locator("body")
                .innerText()
                .catch(
                  () => ""
                );

            console.log(
              "THUELENS_DIAGNOSTIC=" +
              JSON.stringify(
                {
                  requestedUrl:
                    acquisition.requestedUrl,
                  finalUrl:
                    acquisition.finalUrl,
                  canonicalUrl:
                    acquisition.canonicalUrl,
                  acquisitionErrors:
                    acquisition.errors,
                  title:
                    result.facts.title,
                  capturedHeadingTopology,
                  headingTopology,
                  metaTopology,
                  listingCategory:
                    result.facts.listingCategory,
                  breadcrumbs:
                    result.facts.breadcrumbs,
                  visiblePriceTexts:
                    result.facts.visiblePriceTexts,
                  buttons:
                    result.facts.buttons,
                  sections:
                    result.facts.sections,
                  entity:
                    result.analysis.entity,
                  offer:
                    result.analysis.offer,
                  fields:
                    result.fields,
                  validation:
                    result.validation,
                  row:
                    result.row,
                  bodyText:
                    bodyText.slice(
                      0,
                      5000
                    )
                },
                null,
                2
              )
            );
          }
          finally {
            await context.close();
            await browser.close();
          }
          NODE
