name: phase11i1-p1-check

permissions:
  contents: read

on:
  push:
    branches:
      - agent/phase11i1-autofix

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/v02/sectionizer.test.ts tests/v02/extraction/productDetailSemanticFallback.test.ts
      - run: npm test
      - run: npm run check
      - run: npm run build

      - name: Install Chromium for live rental evidence smoke
        run: npx playwright install --with-deps chromium

      - name: Diagnose CameraHouse live facts
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { collectBrowserDetail } from "./dist/v02/extraction/browserDetailCollector.js";
          import { processProductHtml } from "./dist/v02/pipeline/productPipeline.js";

          const url = "https://camerahouse.vn/products/body-sony-a6400";
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1000 }
          });
          const page = await context.newPage();

          try {
            const acquisition =
              await collectBrowserDetail(
                page,
                url
              );

            const result =
              processProductHtml(
                acquisition.html,
                acquisition.canonicalUrl || url,
                "RENTAL"
              );

            const topology =
              await page.evaluate(() => {
                const crop = value =>
                  String(value ?? "")
                    .replace(/\\s+/g, " ")
                    .trim()
                    .slice(0, 5000);

                const attrs = element => {
                  if (!(element instanceof Element)) {
                    return null;
                  }

                  return {
                    tag:
                      element.tagName,
                    id:
                      element.id,
                    className:
                      crop(element.getAttribute("class")),
                    href:
                      element.getAttribute("href"),
                    dataTarget:
                      element.getAttribute("data-target"),
                    dataBsTarget:
                      element.getAttribute("data-bs-target"),
                    ariaControls:
                      element.getAttribute("aria-controls"),
                    role:
                      element.getAttribute("role")
                  };
                };

                const all =
                  Array.from(
                    document.querySelectorAll("*")
                  );

                const smallestContaining =
                  phrase => {
                    const normalizedPhrase =
                      phrase.toLowerCase();

                    const matches =
                      all.filter(element =>
                        crop(element.textContent)
                          .toLowerCase()
                          .includes(normalizedPhrase)
                      );

                    matches.sort(
                      (a, b) =>
                        crop(a.textContent).length -
                        crop(b.textContent).length
                    );

                    const element =
                      matches[0] ?? null;

                    if (!element) {
                      return null;
                    }

                    return {
                      element:
                        attrs(element),
                      text:
                        crop(element.textContent),
                      outerHTML:
                        crop(element.outerHTML),
                      parent:
                        element.parentElement
                          ? {
                              element:
                                attrs(element.parentElement),
                              outerHTML:
                                crop(element.parentElement.outerHTML)
                            }
                          : null,
                      grandparent:
                        element.parentElement?.parentElement
                          ? {
                              element:
                                attrs(element.parentElement.parentElement),
                              outerHTML:
                                crop(element.parentElement.parentElement.outerHTML)
                            }
                          : null
                    };
                  };

                const descriptionHeading =
                  all.find(element => {
                    const tag =
                      element.tagName.toLowerCase();

                    if (
                      !/^h[1-6]$/.test(tag) &&
                      tag !== "button" &&
                      tag !== "a" &&
                      element.getAttribute("role") !== "tab"
                    ) {
                      return false;
                    }

                    return crop(element.textContent)
                      .toLowerCase() === "mô tả";
                  }) ?? null;

                const headingTopology =
                  descriptionHeading
                    ? {
                        element:
                          attrs(descriptionHeading),
                        outerHTML:
                          crop(descriptionHeading.outerHTML),
                        nextSibling:
                          descriptionHeading.nextElementSibling
                            ? {
                                element:
                                  attrs(descriptionHeading.nextElementSibling),
                                outerHTML:
                                  crop(descriptionHeading.nextElementSibling.outerHTML)
                              }
                            : null,
                        parent:
                          descriptionHeading.parentElement
                            ? {
                                element:
                                  attrs(descriptionHeading.parentElement),
                                outerHTML:
                                  crop(descriptionHeading.parentElement.outerHTML)
                              }
                            : null,
                        grandparent:
                          descriptionHeading.parentElement?.parentElement
                            ? {
                                element:
                                  attrs(descriptionHeading.parentElement.parentElement),
                                outerHTML:
                                  crop(descriptionHeading.parentElement.parentElement.outerHTML)
                              }
                            : null
                      }
                    : null;

                return {
                  bodyHasGiaThue:
                    crop(document.body?.innerText)
                      .toLowerCase()
                      .includes("giá thuê"),
                  headingTopology,
                  rentalText:
                    smallestContaining("GIÁ THUÊ"),
                  sensorText:
                    smallestContaining("APS-C"),
                  includedText:
                    smallestContaining("Set thiết bị")
                };
              });

            console.log(
              "CAMERAHOUSE_TOPOLOGY=" +
              JSON.stringify(
                topology,
                null,
                2
              )
            );

            console.log(
              "CAMERAHOUSE_DIAGNOSTIC=" +
              JSON.stringify(
                {
                  requestedUrl:
                    acquisition.requestedUrl,
                  finalUrl:
                    acquisition.finalUrl,
                  canonicalUrl:
                    acquisition.canonicalUrl,
                  acquisitionErrors:
                    acquisition.errors,
                  title:
                    result.facts.title,
                  listingCategory:
                    result.facts.listingCategory,
                  sections:
                    result.facts.sections,
                  visiblePriceTexts:
                    result.facts.visiblePriceTexts,
                  buttons:
                    result.facts.buttons,
                  entity:
                    result.analysis.entity,
                  offer:
                    result.analysis.offer,
                  rentalPrice:
                    result.fields.rentalPrice,
                  salePrice:
                    result.fields.salePrice,
                  validation:
                    result.validation
                },
                null,
                2
              )
            );
          }
          finally {
            await context.close();
            await browser.close();
          }
          NODE

      - name: Diagnose CameraHouse kit facts
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { collectBrowserDetail } from "./dist/v02/extraction/browserDetailCollector.js";
          import { processProductHtml } from "./dist/v02/pipeline/productPipeline.js";

          const url =
            "https://camerahouse.vn/products/sony-a6400-lens-sony-18-105mm";

          const browser =
            await chromium.launch({
              headless: true
            });

          const context =
            await browser.newContext({
              viewport: {
                width: 1440,
                height: 1000
              }
            });

          const page =
            await context.newPage();

          try {
            const acquisition =
              await collectBrowserDetail(
                page,
                url
              );

            const result =
              processProductHtml(
                acquisition.html,
                acquisition.canonicalUrl || url,
                "RENTAL"
              );

            console.log(
              "CAMERAHOUSE_KIT_DIAGNOSTIC=" +
              JSON.stringify(
                {
                  title:
                    result.facts.title,
                  listingCategory:
                    result.facts.listingCategory,
                  sections:
                    result.facts.sections,
                  visiblePriceTexts:
                    result.facts.visiblePriceTexts,
                  buttons:
                    result.facts.buttons,
                  entity:
                    result.analysis.entity,
                  offer:
                    result.analysis.offer,
                  rentalPrice:
                    result.fields.rentalPrice,
                  salePrice:
                    result.fields.salePrice,
                  validation:
                    result.validation
                },
                null,
                2
              )
            );
          }
          finally {
            await context.close();
            await browser.close();
          }
          NODE

      - name: Live rental evidence smoke
        env:
          CAMINTEL_STATE_DB: /tmp/camintel-phase11i1-p1.sqlite
        run: |
          set -euo pipefail

          node dist/v02/cli/collectV2.js "https://thuemayanhsaigon.com/equipment/21" --headless --fresh --site-mode RENTAL --max-pages 1 --max-products 1 --concurrency 1 --output /tmp/sony-a6400.xlsx
          node dist/v02/cli/collectV2.js "https://camerahouse.vn/products/body-sony-a6400" --headless --fresh --site-mode RENTAL --max-pages 1 --max-products 1 --concurrency 1 --output /tmp/camerahouse-a6400.xlsx
          node dist/v02/cli/collectV2.js "https://camerahouse.vn/products/sony-a6400-lens-sony-18-105mm" --headless --fresh --site-mode RENTAL --max-pages 1 --max-products 1 --concurrency 1 --output /tmp/camerahouse-a6400-18105.xlsx

          node --input-type=module <<'NODE'
          import ExcelJS from "exceljs";

          const cases = [
            {
              path: "/tmp/sony-a6400.xlsx",
              url: "https://thuemayanhsaigon.com/equipment/21",
              words: ["sony", "a6400"],
              rentalPrice: 360000
            },
            {
              path: "/tmp/camerahouse-a6400.xlsx",
              url: "https://camerahouse.vn/products/body-sony-a6400",
              words: ["sony", "a6400"],
              rentalPrice: 250000
            },
            {
              path: "/tmp/camerahouse-a6400-18105.xlsx",
              url: "https://camerahouse.vn/products/sony-a6400-lens-sony-18-105mm",
              words: ["sony", "a6400", "18-105"],
              rentalPrice: 350000
            }
          ];

          for (const item of cases) {
            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.readFile(item.path);

            const accepted = workbook.getWorksheet("Dữ liệu đối thủ");

            if (!accepted) {
              throw new Error("Missing accepted sheet for " + item.url);
            }

            const headers = [];
            accepted.getRow(1).eachCell((cell, column) => {
              headers[column] = String(cell.value ?? "").trim();
            });

            const rows = [];

            accepted.eachRow((row, rowNumber) => {
              if (rowNumber === 1) {
                return;
              }

              const record = {};

              row.eachCell((cell, column) => {
                record[headers[column] ?? String(column)] =
                  cell.value ?? "";
              });

              rows.push(record);
            });

            const matched = rows.find(row =>
              String(row.URL ?? "").trim() === item.url
            );

            if (!matched) {
              const review = workbook.getWorksheet("Cần kiểm tra");
              const reviewUrls = [];

              if (review) {
                const reviewHeaders = [];
                review.getRow(1).eachCell((cell, column) => {
                  reviewHeaders[column] = String(cell.value ?? "").trim();
                });

                review.eachRow((row, rowNumber) => {
                  if (rowNumber === 1) {
                    return;
                  }

                  row.eachCell((cell, column) => {
                    if (reviewHeaders[column] === "URL") {
                      reviewUrls.push(String(cell.value ?? ""));
                    }
                  });
                });
              }

              throw new Error(
                "Requested rental product not ACCEPTed: " +
                item.url +
                "; review=" +
                reviewUrls.join(",")
              );
            }

            const name = String(
              matched["Tên sản phẩm"] ?? ""
            ).toLowerCase();

            for (const word of item.words) {
              if (!name.includes(word)) {
                throw new Error(
                  "Unexpected identity for " +
                  item.url +
                  ": " +
                  name
                );
              }
            }

            const form = String(
              matched["Hình thức"] ?? ""
            );

            if (form !== "RENTAL") {
              throw new Error(
                "Expected rental-only form for " +
                item.url +
                ": " +
                form
              );
            }

            const salePrice = Number(
              matched["Giá bán"] ?? 0
            );

            if (salePrice !== 0) {
              throw new Error(
                "Unexpected sale price on explicit rental product " +
                item.url +
                ": " +
                salePrice
              );
            }

            const actualPrice = Number(
              matched["Giá thuê/ngày"]
            );

            if (actualPrice !== item.rentalPrice) {
              throw new Error(
                "Unexpected rental price for " +
                item.url +
                ": expected=" +
                item.rentalPrice +
                "; actual=" +
                actualPrice
              );
            }
          }

          console.log("LIVE_RENTAL_EVIDENCE_SMOKE=PASS");
          NODE
